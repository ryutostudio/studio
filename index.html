<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ryuto Studio</title>
<meta name="description" content="Ryuto Studio の写真。">
<meta name="theme-color" content="#0e0d0c">
<style>
/* VOICE quiet, personal: one person's rooms, garden and animals, shown without commentary
   IDEA a wall of prints pinned edge to edge, rows of different heights like a market heat map,
        nothing cropped: every frame keeps its own shape
   PICTURE the photographs are the whole page; the header is a single line of type
   COLOUR night ground #0e0d0c, warm paper ink #ece6dc, muted #b3a99b, amber #e6b35a for the one accent
   TYPE system sans (Hiragino / Noto Sans JP); wide letter-spacing on the studio name
   LAYOUT header, the mosaic (justified rows, heights in a repeating rhythm), a short footer; viewer on tap */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
:root{--bg:#0e0d0c;--ink:#ece6dc;--sub:#b3a99b;--line:#2c2926;--amber:#e6b35a;--tile:#1a1816}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;overflow-x:clip}
.band{padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
header{padding-top:clamp(20px,4vw,40px);padding-bottom:clamp(16px,2.6vw,26px)}
.eyebrow{margin:0;font-weight:400;line-height:1.7;color:var(--amber);font-size:13px;letter-spacing:.32em;text-transform:uppercase}
.back{margin:0 0 14px}
.back a{display:inline-block;padding:2px 6px;margin-left:-6px;font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier,monospace;font-size:13px;font-weight:600;color:#fff;text-decoration:none;border:1px solid transparent}
.back a:hover,.back a:focus-visible{border-color:#fff;background:#222;outline:none}
#mosaic{display:flex;flex-direction:column;gap:3px;padding-bottom:8px}
.mrow{display:flex;gap:3px}
.stack{display:flex;flex-direction:column;gap:3px;flex:none;height:100%}
.tile{position:relative;flex:none;height:100%;padding:0;border:0;margin:0;background:var(--tile);cursor:zoom-in;overflow:hidden;display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s,transform .4s}
.tile img.wait{opacity:0}
.tile:hover img{transform:scale(1.02)}
.tile:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.tile .play{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(14,13,12,.66);display:grid;place-items:center}
.tile .play::before{content:"";margin-left:3px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
noscript p{color:var(--sub)}
footer{padding-top:28px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));color:var(--sub);font-size:13px;line-height:1.8}
footer p{margin:0}
#lb{position:fixed;inset:0;z-index:10;background:#060505;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#lb[hidden]{display:none}
#lbTop{display:flex;align-items:center;justify-content:flex-end;padding:10px 16px}
#lbX{width:40px;height:40px;padding:0;font:300 26px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;cursor:pointer}
#lbX:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;padding-bottom:12px}
#stage img,#stage video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.side{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:6px;background:rgba(14,13,12,.5);color:#fff;font-size:28px;line-height:1;padding:0;cursor:pointer}
#prev{left:8px}#next{right:8px}
</style>
</head>
<body>
<header class="band"><p class="back"><a href="https://ryutostudio.github.io/">[ ← Main Archive ]</a></p><h1 class="eyebrow">Ryuto Studio</h1></header>
<main class="band"><div id="mosaic" aria-label="写真の一覧"></div><noscript><p>写真の一覧を表示するには JavaScript を有効にしてください。</p></noscript></main>
<footer class="band"><p>写真：酒勾龍渡（Ryuto Sako）</p></footer>
<div id="lb" hidden role="dialog" aria-modal="true" aria-label="写真を大きく表示">
<div id="lbTop"><button id="lbX" type="button" aria-label="閉じる">×</button></div>
<div id="stage"><button class="side" id="prev" type="button" aria-label="前の写真">‹</button><button class="side" id="next" type="button" aria-label="次の写真">›</button></div>
</div>

<script>
(() => {
  const list = JSON.parse(document.getElementById('photo-list').textContent);
  const box = document.getElementById('mosaic');
  const lb = document.getElementById('lb'), stage = document.getElementById('stage');
  const GAP = 3;
  const RHYTHM = [1, 1.45, 0.9, 1.2, 0.85, 1.6];   // row heights repeat in this pattern, like the blocks of a heat map

  const tiles = list.map((it, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile';
    b.setAttribute('aria-label', (it.video ? '動画 ' : '写真 ') + (i + 1) + ' を大きく表示');
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.className = 'wait';
    img.addEventListener('load', () => img.classList.remove('wait'));
    img.src = 'thumbs/' + it.n + '.jpg';
    b.appendChild(img);
    if (it.video) { const p = document.createElement('span'); p.className = 'play'; b.appendChild(p); }
    b.addEventListener('click', () => open(i));
    return b;
  });

  // a unit is one photo, or two photos in one column ("st":1 on the upper one)
  const units = [];
  for (let i = 0; i < list.length; i++) {
    if (list[i].st && i + 1 < list.length) {
      units.push({ k: [i, i + 1], c: 1 / (list[i].h / list[i].w + list[i + 1].h / list[i + 1].w) });
      i++;
    } else {
      units.push({ k: [i], a: list[i].w / list[i].h, lg: !!list[i].lg });
    }
  }
  const BIG = 1.3;   // a row holding an "lg" photo is this much taller (not when it also holds a column of two)

  let lastW = 0;
  function layout() {
    const W = box.clientWidth;
    if (!W || W === lastW) return;
    lastW = W;
    const H0 = W < 600 ? 118 : W < 1000 ? 170 : 215;
    const frag = document.createDocumentFragment();
    let u = 0, r = 0;
    while (u < units.length) {
      const base = H0 * RHYTHM[r % RHYTHM.length];
      const row = [];
      let sa = 0, sc = 0, big = false, pair = false, h = base;
      while (u < units.length) {
        const U = units[u];
        row.push(U);
        if (U.c) { sc += U.c; pair = true; } else { sa += U.a; if (U.lg) big = true; }
        u++;
        h = base * (big && !pair ? BIG : 1);
        if (sa * h + sc * (h - GAP) + GAP * (row.length - 1) >= W) break;
      }
      let rh = (W - GAP * (row.length - 1) + GAP * sc) / (sa + sc);
      if (u >= units.length && rh > h) rh = h;               // the last row keeps its height instead of stretching
      const div = document.createElement('div');
      div.className = 'mrow';
      div.style.height = rh.toFixed(2) + 'px';
      for (const U of row) {
        if (U.c) {
          const col = document.createElement('div');
          col.className = 'stack';
          const cw = (rh - GAP) * U.c;
          col.style.width = cw.toFixed(2) + 'px';
          for (const k of U.k) {
            tiles[k].style.width = '100%';
            tiles[k].style.height = (cw * list[k].h / list[k].w).toFixed(2) + 'px';
            col.appendChild(tiles[k]);
          }
          div.appendChild(col);
        } else {
          const k = U.k[0];
          tiles[k].style.width = (U.a * rh).toFixed(2) + 'px';
          div.appendChild(tiles[k]);
        }
      }
      frag.appendChild(div);
      r++;
    }
    box.textContent = '';
    box.appendChild(frag);
  }
  layout();
  new ResizeObserver(() => layout()).observe(box);

  let cur = -1, sx = null, lastFocus = null;
  function show(i) {
    cur = (i + list.length) % list.length;
    const it = list[cur];
    for (const el of stage.querySelectorAll('img,video')) el.remove();
    let el;
    if (it.video) {
      el = document.createElement('video');
      el.controls = true; el.playsInline = true; el.preload = 'metadata';
      el.poster = 'thumbs/' + it.n + '.jpg';
      el.src = 'videos/' + it.n + '.mp4';
    } else {
      el = document.createElement('img');
      el.alt = '写真 ' + (cur + 1);
      el.src = 'thumbs/' + it.n + '.jpg';
      const full = new Image();
      full.onload = () => { if (list[cur] === it) el.src = full.src; };
      full.src = 'photos/' + it.n + '.jpg';
      const nx = list[(cur + 1) % list.length];
      if (!nx.video) { const pre = new Image(); pre.src = 'photos/' + nx.n + '.jpg'; }
    }
    stage.insertBefore(el, stage.firstChild);
  }
  function open(i) {
    lastFocus = document.activeElement;
    lb.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    show(i);
    document.getElementById('lbX').focus();
  }
  function close() {
    lb.hidden = true;
    document.documentElement.style.overflow = '';
    for (const el of stage.querySelectorAll('img,video')) el.remove();
    if (lastFocus) lastFocus.focus();
    cur = -1;
  }
  document.getElementById('lbX').addEventListener('click', close);
  document.getElementById('prev').addEventListener('click', () => show(cur - 1));
  document.getElementById('next').addEventListener('click', () => show(cur + 1));
  document.addEventListener('keydown', ev => {
    if (lb.hidden) return;
    if (ev.key === 'Escape') close();
    else if (ev.key === 'ArrowLeft') show(cur - 1);
    else if (ev.key === 'ArrowRight') show(cur + 1);
  });
  stage.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', ev => {
    if (sx === null) return;
    const dx = ev.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });
})();
</script>
